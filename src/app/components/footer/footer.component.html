<footer class="portfolio-footer">

      <span class="footer-brand">&lt;{{ profile().name }} /&gt;</span>
      <p class="footer-tagline">
        // {{ profile().role }}
      </p>
    </div>

    <div class="footer-links">
      <a href="#perfil">// PERFIL</a>
      <a href="#habilidades">// HABILIDADES</a>
